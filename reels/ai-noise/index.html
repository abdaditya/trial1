<script>
// ===========================================================================
// zbacktrack · AI, explained No. 01 · "What happens when you ask AI for an image"
// One living poster world (parallax layers: sky, far clouds, peak, sea of clouds, mist),
// real per-pixel diffusion noise on top of it, kinetic poster typography.
// Deterministic: window.seek(t) draws frame t and returns its text boxes for QA.
// ===========================================================================
const W = 1080, H = 1920, DUR = 63.8, SHIFT = 2.8, OPEN_END = 11.0;   // body timeline runs SHIFT s later than its T values
const cv = document.getElementById("c"), g = cv.getContext("2d", { willReadFrequently: true });

const SAFE = { x0: 90, x1: 990, y0: 250, y1: 1400 };

// ---------- math ----------

// ===========================================================================
// WORLD: painted once into parallax layers (1.5× screen so the camera can move)

// camera: cx, cy (world), z (zoom), roll. Each layer gets parallax factor f.

}

  ctx.fillStyle = "#7a5a46"; ctx.beginPath(); ctx.arc(.5, -65, 7, 0, 6.283); ctx.fill();

// DIFFUSION: x = cos(s·π/2)·picture + sin(s·π/2)·gaussian noise, per pixel, with a local s-field

// ===========================================================================
// TYPE: kinetic poster typography + QA registry (boxes with measured contrast)
// ===========================================================================
