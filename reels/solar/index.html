<script>
// "Why India can't move its solar power" — voiced reel, 1080x1920, deterministic: window.seek(t) draws frame t.
// Scenes draw onto `g` (swapped to an off-screen buffer during transitions); captions go on top of everything.
const W = 1080, H = 1920, DUR = 92;
const SAFE = { x0: 90, x1: 990, y0: 250, y1: 1540 };
const MAIN = document.getElementById("c"), gm = MAIN.getContext("2d", { willReadFrequently: true });

const mk = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; };

}
const WD = window.WORDS, ws = i => WD[i][1];

// ---------------- assets ----------------
const IM = {}; const loads = [];
for (const n of ["bhadla1", "bhadla2", "bhadla3", "pylon_gr", "city", "dp", "punjab"]) { const im = new Image(); im.src = `img/${n}.jpg`; IM[n] = im; loads.push(new Promise(r => { im.onload = r; im.onerror = r; })); }
const grain = mk(); grain.width = grain.height = 512;
{ const gg = grain.getContext("2d"), d = gg.createImageData(512, 512); for (let i = 0; i < d.data.length; i += 4) { const v = R() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } gg.putImageData(d, 0, 0); }

// ---------------- 2D helpers ----------------

// ---------------- captions (synced to the voice) ----------------

// small uppercase kicker (gold on dark, rust on cream)

// ======================================================================
// 3D (three.js) — only for the Earth, the dam, the land plots and the stop switch
// ======================================================================
const GLC = document.createElement("canvas"); GLC.width = W; GLC.height = H;
const RND = new THREE.WebGLRenderer({ canvas: GLC, antialias: true, preserveDrawingBuffer: true });

const CAM = new THREE.PerspectiveCamera(35, W / H, .01, 400);

// ---------- Earth ----------
const EARTH = new THREE.Scene(); let EARTH_MAT, ATM;

const SITES = { bhadla: [27.54, 71.92], charanka: [23.9, 71.2], khavda: [23.92, 69.72] };
const CITIES = { Delhi: [28.61, 77.21], Mumbai: [19.08, 72.88], Kolkata: [22.57, 88.36], Chennai: [13.08, 80.27], Bengaluru: [12.97, 77.59], Hyderabad: [17.39, 78.49], Pune: [18.52, 73.86], Lucknow: [26.85, 80.95] };
const HOT = [], COLS = [], ARCS = [];
async function buildEarth() {

function earthCam(lat, lon, d, offY = -160) { CAM.fov = 35; CAM.position.copy(ll2v(lat, lon, d)); CAM.up.set(0, 1, 0); CAM.lookAt(0, 0, 0); CAM.clearViewOffset(); CAM.setViewOffset(W, H, 0, offY, W, H); CAM.updateProjectionMatrix(); }
// Earth state for any t in its two windows

}
function earthOverlay(t) {

    lab("RAJASTHAN", ...SITES.bhadla, 110, -150, win(t, ws(46) - .05, 20.2, .3, .4), "lab:raj");
