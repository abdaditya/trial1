<body><canvas id="c" width="1080" height="1920"></canvas>

<script>
// "Why India can't move its solar power" — voiced reel, 1080x1920, deterministic: window.seek(t) draws frame t.
// Scenes draw onto `g` (swapped to an off-screen buffer during transitions); captions go on top of everything.
const W = 1080, H = 1920;
// voice edit: "and Khavda in Kutch" removed (orig 15.42-16.38), 0.25 s room tone kept after "Gujarat" -> 0.73 s shorter
const CUT0 = 15.41, CUTD = .73, DUR = 92 - CUTD;
const toOrig = t => t < CUT0 ? t : t + CUTD, toEdit = t => t < CUT0 ? t : t - CUTD;
const SAFE = { x0: 90, x1: 950, y0: 250, y1: 1540 }, CX = 520;   // playbook danger zones; text centres on x 520
const MAIN = document.getElementById("c"), gm = MAIN.getContext("2d", { willReadFrequently: true });
let g = gm;
const mk = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; };
const bufA = mk(), bufB = mk(), ga = bufA.getContext("2d"), gb = bufB.getContext("2d");
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lerp = (a, b, k) => a + (b - a) * k;

const win = (t, a, b, fi = .3, fo = .3) => Math.min(eo(prog(t, a, a + fi)), 1 - eio(prog(t, b - fo, b)));
const R = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(42);
function track(keys, t) {   // keys: [[t, [v...]], ...] eased between keys
  if (t <= keys[0][0]) return keys[0][1].slice(); const L = keys[keys.length - 1]; if (t >= L[0]) return L[1].slice();
  for (let i = 0; i < keys.length - 1; i++) { const [t0, a] = keys[i], [t1, b] = keys[i + 1]; if (t <= t1) { const k = eio(prog(t, t0, t1)); return a.map((v, j) => lerp(v, b[j], k)); } }
}
const WD = window.WORDS, ws = i => WD[i][1];

// ---------------- assets ----------------
const IM = {}; const loads = [];
for (const [k, f] of [["mask", "bhadla2_mask.png"], ["mask1", "bhadla1_mask.png"], ["dam", "dam.jpg"]]) { const im = new Image(); im.src = "img/" + f; IM[k] = im; loads.push(new Promise(r => { im.onload = r; im.onerror = r; })); }
for (const n of ["bhadla1", "bhadla2", "bhadla3", "pylons_in", "city", "dp", "punjab", "khavda_c"]) { const im = new Image(); im.src = `img/${n}.jpg`; IM[n] = im; loads.push(new Promise(r => { im.onload = r; im.onerror = r; })); }
const grain = mk(); grain.width = grain.height = 512;
{ const gg = grain.getContext("2d"), d = gg.createImageData(512, 512); for (let i = 0; i < d.data.length; i += 4) { const v = R() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } gg.putImageData(d, 0, 0); }

// ---------------- 2D helpers ----------------
function lum(p) { const l = v => (v /= 255) <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; return .2126 * l(p[0]) + .7152 * l(p[1]) + .0722 * l(p[2]); }

  for (let i = 0; i < d.length; i += 44) L.push(lum([d[i], d[i + 1], d[i + 2]])); L.sort((a, b) => a - b);
  return ink ? (L[Math.floor(L.length * .1)] + .05) / (.0065 + .05) : 1.05 / (L[Math.floor(L.length * .9)] + .05); }
let LAST = null, GOLDL = null, GOLD1 = null;
function photo(im, fx, fy, z, filter, dx = 0) {
  if (!im.naturalWidth) { g.fillStyle = "#1a1820"; g.fillRect(0, 0, W, H); return (u, v) => [u * W, v * H]; }
  if (!im.naturalWidth) { g.fillStyle = "#1a1820"; g.fillRect(0, 0, W, H); return (u, v) => [u * W, v * H]; }
  const s = Math.max(W / im.width, H / im.height) * z, iw = im.width * s, ih = im.height * s;

}
function shade(a = .8, to = 820, bottom = .55) {

}
function vignette(a = .45, col = "0,0,0") { const r = g.createRadialGradient(W / 2, H * .55, H * .32, W / 2, H * .55, H * .85); r.addColorStop(0, `rgba(${col},0)`); r.addColorStop(1, `rgba(${col},${a})`); g.fillStyle = r; g.fillRect(0, 0, W, H); }

let BOXES = [], SHAKE = [0, 0];
const reg = (id, x, y, w, h, a, size, contrast = 12, words = 0, group) => BOXES.push({ id, group, words, x, y, w, h, a, read: a, contrast, size });
const regEl = (id, x, y, w, h, a, group) => a > .02 && BOXES.push({ id, group, el: 1, x, y, w, h, a, read: 0 });

// ---------------- captions (synced to the voice) ----------------
// tokens like "-of", ",133", ".4", "%" are glued to the word before
function tokens(i0, i1) { const out = []; for (let i = i0; i <= i1; i++) { const w = WD[i][0]; if (/^[-,.%]/.test(w) && out.length) out[out.length - 1][0] += w; else out.push([w, WD[i][1]]); } return out; }

// one caption: words appear as spoken, wrapped into balanced lines
function caption(t, c) {

  const out = eio(prog(t, t1 - .28, t1)), toks = tokens(i0, i1).map(([w, tt]) => [w, tt, st[key(w)] || {}]);

  g = gm; g.save();

  // wrap: fewest lines that fit maxW, then balance the line widths
  const wrap = lim => { const L = []; let cur = [], cw = 0; toks.forEach((tk, i) => { const add = (cur.length ? sp : 0) + wid[i]; if (cur.length && cw + add > lim) { L.push(cur); cur = []; cw = 0; } cur.push(i); cw += (cur.length > 1 ? sp : 0) + wid[i]; }); L.push(cur); return L; };
  let lines = wrap(maxW); const nL = lines.length; for (let lim = maxW; lim > 200; lim -= 10) { const L2 = wrap(lim); if (L2.length > nL) break; lines = L2; }
  const lh = size * 1.14, yTop = center ? y - (lines.length * lh) / 2 + size * .8 : y;
  lines.forEach((L, li) => {
    const lw = L.reduce((a, i) => a + wid[i], 0) + sp * (L.length - 1); let x = CX - lw / 2; const yy = yTop + li * lh, x0 = x, y0 = yy - size * .8, firstT = toks[L[0]][1];
    const ga0 = eo(prog(t, firstT - .05, firstT + .3)) * (1 - out);
    if (!ink) { g.save(); g.filter = `blur(${size * .32}px)`; g.fillStyle = "rgba(8,6,12,1)"; g.globalAlpha = .78 * ga0; g.fillRect(x0 - size * .2, y0 - size * .05, lw + size * .4, size * 1.15); g.restore(); }

  });

}
// small uppercase kicker (gold on dark, rust on cream)
function kicker(t, s, t0, t1, y = 318, cream = false) {
  const a = win(t, t0, t1, .35, .3); if (a <= 0) return;
  g = gm; g.save(); g.font = "700 30px Inter"; g.letterSpacing = "5px"; const tw = g.measureText(s).width, x = CX - tw / 2 + 14;
  g.globalAlpha = a; g.fillStyle = cream ? "#B4501F" : "#F2B544"; g.beginPath(); g.arc(x - 26, y - 10, 7, 0, 7); g.fill();
  g.fillStyle = cream ? "#9A3F14" : "#F2C46A"; g.fillText(s, x, y - (1 - a) * 10); g.restore();

// ======================================================================
// 3D (three.js) — only for the Earth, the dam, the land plots and the stop switch
// ======================================================================
const GLC = document.createElement("canvas"); GLC.width = W; GLC.height = H;
const RND = new THREE.WebGLRenderer({ canvas: GLC, antialias: true, preserveDrawingBuffer: true });
RND.setSize(W, H, false); RND.outputColorSpace = THREE.SRGBColorSpace; RND.toneMapping = THREE.ACESFilmicToneMapping; RND.toneMappingExposure = 1.05;
const CAM = new THREE.PerspectiveCamera(35, W / H, .01, 400);

function draw3D(scene, bg) { RND.setClearColor(bg ?? 0x000000, 1); RND.render(scene, CAM); g.drawImage(GLC, 0, 0); }
function screenOf(v) { const p = v.clone().project(CAM); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H, p.z]; }
function glowTex(r, g2, b) { const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d"), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);

// ---------- Earth ----------
const EARTH = new THREE.Scene(); let EARTH_MAT, ATM;
const ll2v = (lat, lon, r = 1) => { const ph = (lon + 180) * Math.PI / 180, th = (90 - lat) * Math.PI / 180; return new THREE.Vector3(-Math.cos(ph) * Math.sin(th) * r, Math.cos(th) * r, Math.sin(ph) * Math.sin(th) * r); };
const SITES = { bhadla: [27.539, 71.915], charanka: [23.92, 71.2], khavda: [23.98, 69.55] };   // Bhadla Solar Park, Charanka Solar Park, Khavda RE Park
const STATES = { RAJASTHAN: [26.6, 73.8], GUJARAT: [22.9, 72.0] };   // label centres well inside each state
const CITIES = { Delhi: [28.61, 77.21], Mumbai: [19.08, 72.88], Kolkata: [22.57, 88.36], Chennai: [13.08, 80.27], Bengaluru: [12.97, 77.59], Hyderabad: [17.39, 78.49], Pune: [18.52, 73.86], Lucknow: [26.85, 80.95] };
const HOT = [], COLS = [], ARCS = [];
async function buildEarth() {
  const [day, night, hi] = await Promise.all([tex("img/earth_bm.jpg"), tex("img/earth_night.jpg"), tex("img/india_bm.jpg")]);
  EARTH_MAT = new THREE.ShaderMaterial({ uniforms: { day: { value: day }, night: { value: night }, hi: { value: hi }, sun: { value: new THREE.Vector3(.4, .5, 1).normalize() }, nightAmt: { value: 0 }, dayAmt: { value: 1 } },
    vertexShader: `varying vec2 vUv; varying vec3 vN; void main(){ vUv=uv; vN=normalize(mat3(modelMatrix)*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader: `uniform sampler2D day,night,hi; uniform vec3 sun; uniform float nightAmt,dayAmt; varying vec2 vUv; varying vec3 vN;
      void main(){ vec3 d=texture2D(day,vUv).rgb;
        // NASA Blue Marble at 120 px/degree over 58-100E, 2-40N (no borders, imagery only), feathered into the base
        vec2 h=vec2((vUv.x*360.0-180.0-58.0)/42.0,(vUv.y*180.0-90.0-2.0)/38.0);
        float e=smoothstep(0.0,.04,h.x)*smoothstep(0.0,.04,1.0-h.x)*smoothstep(0.0,.04,h.y)*smoothstep(0.0,.04,1.0-h.y);
        if(e>0.0) d=mix(d,texture2D(hi,clamp(h,0.0,1.0)).rgb,e);
        vec3 n=texture2D(night,vUv).rgb; float l=dot(normalize(vN),normalize(sun)); float dl=smoothstep(-.2,.45,l);
        vec3 col=d*(.18+1.05*dl)*dayAmt + n*vec3(1.0,.78,.5)*nightAmt*2.2*(1.15-.55*dl); gl_FragColor=vec4(col,1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }` });

  ATM = new THREE.Mesh(new THREE.SphereGeometry(1.07, 96, 72), new THREE.ShaderMaterial({ side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    vertexShader: `varying vec3 vN; void main(){ vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader: `varying vec3 vN; void main(){ float i=pow(.72-dot(vN,vec3(0,0,1.0)),3.0); gl_FragColor=vec4(.42,.66,1.0,1.0)*i*1.4; }` }));

  const sg = new THREE.BufferGeometry(), sp = []; for (let i = 0; i < 2600; i++) { const v = new THREE.Vector3(R() - .5, R() - .5, R() - .5).normalize().multiplyScalar(60 + R() * 40); sp.push(v.x, v.y, v.z); }
  sg.setAttribute("position", new THREE.Float32BufferAttribute(sp, 3)); EARTH.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xcfd6ff, size: .16, transparent: true, opacity: .75 })));

    col.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), n); const base = new THREE.Sprite(new THREE.SpriteMaterial({ map: WARM, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));

}
function earthCam(lat, lon, d, offY = -160) { CAM.fov = 35; CAM.position.copy(ll2v(lat, lon, d)); CAM.up.set(0, 1, 0); CAM.lookAt(0, 0, 0); CAM.clearViewOffset(); CAM.setViewOffset(W, H, 0, offY, W, H); CAM.updateProjectionMatrix(); }
// Earth state for any t in its two windows
function earthFrame(t) {
  let cam, night = 0, hotA = 0, hotPulse = 0, colA = 0, arcK = [0, 0], finale = t > 80;
  if (!finale) {
    cam = track([[10.9, [25.6, 71.0, 1.9]], [11.2, [25.6, 71.0, 1.9]], [12.3, [21, 78, 3.6]], [12.6, [21, 78, 3.6]], [14.3, [24.6, 72.3, 1.6]], [15.41, [24.55, 72.4, 1.58]], [16.14, [24.55, 72.4, 1.58]], [19.6, [24.3, 72.9, 1.52]], [21.9, [21.5, 78.5, 2.35]], [25.4, [21.3, 79.2, 2.3]]], t);

  HOT.forEach((s, i) => { const p = Math.sin(t * 5 + i) * .5 + .5; s.material.opacity = hotA; s.scale.setScalar((.022 + .005 * p) * (1 + .6 * Math.sin(Math.PI * hotPulse))); });
