<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Playfair"; src: url(fonts/PlayfairDisplay-800.woff2) format("woff2"); font-weight: 400 900; font-style: normal; }
@font-face { font-family: "Playfair"; src: url(fonts/PlayfairDisplay-800i.woff2) format("woff2"); font-weight: 400 900; font-style: italic; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-700.woff2) format("woff2"); font-weight: 100 900; }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Solar reel, frame-0 options (first 5.3 s of the voice). ?opt=A|B|C
// A: Bhadla horizon — panels to the edge of the world.
// B: Bhadla substation — power tries to leave, and stops.
// C: Bhadla rows, golden hour — the panels in close-up.
const OPT = new URLSearchParams(location.search).get("opt") || "A";
const W = 1080, H = 1920, c = document.getElementById("c"), g = c.getContext("2d");
const SAFE = { x0: 90, x1: 990, y0: 250, y1: 1400 };
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a)), eo = k => 1 - (1 - k) ** 3, eio = k => k < .5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2;
const DUR = 5.3;

// word timings from audio/words.json (first sentence)
const WT = [["India", 0.00], ["built", .36], ["the", .62], ["solar", .80], ["farms", 1.00], ["faster", 1.40], ["than", 1.72], ["anyone", 2.06], ["expected,", 2.44],
            ["but", 3.02], ["can't", 3.46], ["send", 3.68], ["the", 3.90], ["power", 4.06], ["anywhere.", 4.26]];
const T_BUT = 3.02, T_SEND = 3.68, T_ANY = 4.26;

const IMG = { A: "img/bhadla1.jpg", B: "img/bhadla3.jpg", C: "img/bhadla2.jpg" }[OPT];
const TAG = { A: "BHADLA SOLAR PARK · RAJASTHAN", B: "BHADLA SOLAR PARK · RAJASTHAN", C: "BHADLA SOLAR PARK · RAJASTHAN" }[OPT];
const img = new Image(); img.src = IMG;

// film grain, made once
const grain = document.createElement("canvas"); grain.width = grain.height = 512;
{ const gg = grain.getContext("2d"), d = gg.createImageData(512, 512); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } gg.putImageData(d, 0, 0); }

function lum(p) { const l = v => (v /= 255) <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; return .2126 * l(p[0]) + .7152 * l(p[1]) + .0722 * l(p[2]); }
function contrastUnder(x, y, w, h) { const X = clamp(x | 0, 0, W - 1), Y = clamp(y | 0, 0, H - 1), d = g.getImageData(X, Y, clamp(w | 0, 1, W - X), clamp(h | 0, 1, H - Y)).data, L = [];
  for (let i = 0; i < d.length; i += 44) L.push(lum([d[i], d[i + 1], d[i + 2]])); L.sort((a, b) => a - b); return 1.05 / (L[Math.floor(L.length * .9)] + .05); }

// photo: cover-fit, centred on (fx, fy) of the image, zoom z, with a colour grade
function photo(fx, fy, z, filter) {
  const s = Math.max(W / img.width, H / img.height) * z, iw = img.width * s, ih = img.height * s;
  let x = W / 2 - fx * iw, y = H / 2 - fy * ih; x = clamp(x, W - iw, 0); y = clamp(y, H - ih, 0);
  g.save(); g.filter = filter; g.drawImage(img, x, y, iw, ih); g.restore();
  return (u, v) => [x + u * iw, y + v * ih];   // image coords -> screen
}
function topShade(a = .9, to = 980) {
  const gr = g.createLinearGradient(0, 0, 0, to); gr.addColorStop(0, `rgba(10,9,14,${a})`); gr.addColorStop(.55, `rgba(10,9,14,${a * .72})`); gr.addColorStop(1, "rgba(10,9,14,0)");
  g.fillStyle = gr; g.fillRect(0, 0, W, to);
  const gb = g.createLinearGradient(0, H - 420, 0, H); gb.addColorStop(0, "rgba(10,9,14,0)"); gb.addColorStop(1, "rgba(10,9,14,.55)"); g.fillStyle = gb; g.fillRect(0, H - 420, W, 420);
}
function vignette() { const r = g.createRadialGradient(W / 2, H * .55, H * .35, W / 2, H * .55, H * .85); r.addColorStop(0, "rgba(0,0,0,0)"); r.addColorStop(1, "rgba(0,0,0,.45)"); g.fillStyle = r; g.fillRect(0, 0, W, H); }
function filmGrain(t) { g.save(); g.globalAlpha = .045; g.globalCompositeOperation = "overlay"; const o = (t * 997 | 0) % 512; for (let y = -o; y < H; y += 512) for (let x = -o % 512; x < W; x += 512) g.drawImage(grain, x, y); g.restore(); }

let BOXES = [];
// small uppercase name-tag (Wiz style): gold dot + letter-spaced caps
function tag(t) {
  const a = eo(prog(t, .05, .5)); if (a <= 0) return;
  g.save(); g.font = "700 30px Inter"; g.letterSpacing = "5px"; const tw = g.measureText(TAG).width, x = 540 - tw / 2 + 14, y = 318;
  g.globalAlpha = a; g.fillStyle = "#F2B544"; g.beginPath(); g.arc(x - 26, y - 10, 7, 0, 7); g.fill();
  g.fillStyle = "#F2C46A"; g.fillText(TAG, x, y - (1 - a) * 10); g.restore();
  BOXES.push({ id: "tag", x: x - 40, y: y - 26, w: tw + 40, h: 34, a, read: a, contrast: 9, size: 36 });
}

// one headline line, words appear exactly when spoken; style per word
// spec: [word, time, {hl:"lav"|"orange", it:true}]
function line(id, spec, size, y, t, dim = 0) {
  g.save(); g.textBaseline = "alphabetic";
  const fontOf = s => `${s.it ? "italic " : ""}800 ${size}px Playfair`;
  const ws = spec.map(s => { g.font = fontOf(s[2] || {}); return g.measureText(s[0]).width; }); g.font = `800 ${size}px Playfair`;
  const sp = size * .26, tw = ws.reduce((a, b) => a + b, 0) + sp * (spec.length - 1);
  let x = 540 - tw / 2; const x0 = x, y0 = y - size * .8;
  { const ga = eo(prog(t, spec[0][1] - .04, spec[0][1] + .3)); g.save(); g.filter = `blur(${size * .32}px)`; g.fillStyle = "rgba(8,6,12,1)"; g.globalAlpha = .7 * ga;
    g.fillRect(x0 - size * .2, y0 - size * .05, tw + size * .4, size * 1.15); g.restore(); }
  const contrast = contrastUnder(x0, y0, tw, size);
  spec.forEach(([w, t0, st = {}], i) => {
    const k = eo(prog(t, t0 - .04, t0 + .26)); if (k <= 0) { x += ws[i] + sp; return; }
    g.save(); g.font = fontOf(st); g.globalAlpha = k * (1 - dim * .38);
    if (st.hl === "lav") {   // lavender highlighter sweeps left -> right as the word lands
      const hk = eio(prog(t, t0 + .05, t0 + .4)); g.fillStyle = "#B7A3F6"; g.fillRect(x - 8, y - size * .74, (ws[i] + 16) * hk, size * .9);
    }
    g.fillStyle = st.hl === "lav" && prog(t, t0 + .05, t0 + .4) > .5 ? "#1C1433" : st.hl === "orange" ? "#FFA24D" : "#F5EFE3";
    if (k < 1) g.filter = `blur(${(1 - k) * 6}px)`;
    g.fillText(w, x, y + (1 - k) * 16);
    g.restore(); x += ws[i] + sp;
  });
  g.restore();
  const first = spec[0][1], last = spec[spec.length - 1][1];
  // synced captions: readable from the moment their first word is spoken
  BOXES.push({ id, group: "head", words: spec.length, x: x0, y: y0, w: tw, h: size, a: eo(prog(t, first - .04, first + .26)), read: t >= first + .26 ? 1 : 0, contrast, size });
}

function headline(t) {
  const d = eio(prog(t, T_BUT - .1, T_BUT + .35));       // clause 1 lifts and steps back when "but" lands
  const S1 = lerp(66, 56, d), y1 = lerp(430, 404, d);
  line("h1", [["India", 0], ["built", .36], ["the", .62], ["solar", .80], ["farms", 1.0]], S1, y1, t, d);
  line("h2", [["faster", 1.40, { hl: "lav" }], ["than", 1.72], ["anyone", 2.06], ["expected,", 2.44]], S1, y1 + S1 * 1.12, t, d);
  if (t >= T_BUT - .05) {
    line("h3", [["but", 3.02], ["can't", 3.46], ["send", 3.68], ["the", 3.90]], 80, 600, t);
    line("h4", [["power", 4.06], ["anywhere.", 4.26, { it: true, hl: "orange" }]], 80, 600 + 90, t);
  }
}

// ---------- the three pictures ----------
function picA(t) {   // horizon: slow push-in; on "but" the warm light drains out
  const z = lerp(1.0, 1.12, eio(prog(t, 0, DUR))), dr = eio(prog(t, T_BUT, T_ANY + .4));
  photo(lerp(.42, .47, t / DUR), .44, z, `sepia(${lerp(.32, .05, dr)}) saturate(${lerp(1.9, 1.05, dr)}) contrast(1.18) brightness(${lerp(1.0, .8, dr)}) hue-rotate(${lerp(-6, 0, dr)}deg)`);
  sky(1 - dr);
}
function sky(k) {   // warm haze over the horizon (the photo's sky is flat white)
  if (k <= 0) return; const gr = g.createLinearGradient(0, 0, 0, 900);
  gr.addColorStop(0, `rgba(255,140,60,${.28 * k})`); gr.addColorStop(.75, `rgba(255,180,90,${.22 * k})`); gr.addColorStop(1, "rgba(255,190,110,0)");
  g.save(); g.globalCompositeOperation = "soft-light"; g.fillStyle = gr; g.fillRect(0, 0, W, 900); g.restore();
  const sun = g.createRadialGradient(780, 660, 0, 780, 660, 520); sun.addColorStop(0, `rgba(255,214,150,${.45 * k})`); sun.addColorStop(1, "rgba(255,214,150,0)");
  g.save(); g.globalCompositeOperation = "screen"; g.fillStyle = sun; g.fillRect(0, 140, W, 1040); g.restore();
}
function picB(t) {   // substation: push towards it; power leaves, hits nothing, dies
  const z = lerp(1.05, 1.32, eio(prog(t, 0, DUR))), dr = eio(prog(t, T_ANY, T_ANY + .6));
  const map = photo(.585, .56, z, `sepia(.18) saturate(1.45) contrast(1.12) brightness(${lerp(.9, .74, dr)})`);
  const [sx, sy] = map(.585, .66);
  // three power lines race out of the substation on "send", stall and die on "anywhere"
  const go = prog(t, T_SEND - .05, T_ANY + .05), die = prog(t, T_ANY + .05, T_ANY + .7);
  if (go > 0) {
    const dirs = [[-1, -.35], [1, -.25], [.15, 1]];
    g.save(); g.globalCompositeOperation = "lighter"; g.lineCap = "round";
    dirs.forEach(([dx, dy], i) => {
      const L = 520 * eo(go) * (1 - .15 * i), n = Math.hypot(dx, dy), ex = sx + dx / n * L, ey = sy + dy / n * L;
      const flick = die > 0 ? (Math.sin(t * 90 + i * 2) > 0 ? 1 : .35) * (1 - die) : 1;
      const col = die > 0 ? `rgba(255,${lerp(170, 60, die) | 0},60,` : "rgba(255,190,90,";
      g.strokeStyle = col + (.35 * flick) + ")"; g.lineWidth = 22; g.filter = "blur(8px)"; g.beginPath(); g.moveTo(sx, sy); g.lineTo(ex, ey); g.stroke();
      g.filter = "none"; g.strokeStyle = col + (.95 * flick) + ")"; g.lineWidth = 5; g.beginPath(); g.moveTo(sx, sy); g.lineTo(ex, ey); g.stroke();
      if (die > 0 && die < .6) { g.fillStyle = `rgba(255,90,60,${(1 - die / .6) * .9})`; g.beginPath(); g.arc(ex, ey, 10 + 30 * die, 0, 7); g.fill(); }
    });
    g.restore();
  }
  // the substation glows while it tries
  const glow = prog(t, T_SEND - .2, T_SEND + .2) * (1 - die);
  if (glow > 0) { const r = g.createRadialGradient(sx, sy, 0, sx, sy, 160); r.addColorStop(0, `rgba(255,200,110,${.55 * glow})`); r.addColorStop(1, "rgba(255,200,110,0)"); g.save(); g.globalCompositeOperation = "lighter"; g.fillStyle = r; g.fillRect(sx - 160, sy - 160, 320, 320); g.restore(); }
}
function picC(t) {   // rows close-up, golden-hour grade; a sun-glint runs down the rows; cools on "but"
  const z = lerp(1.18, 1.0, eio(prog(t, 0, DUR))), dr = eio(prog(t, T_BUT, T_ANY + .4));
  photo(lerp(.55, .5, t / DUR), .6, z, `saturate(${lerp(1.45, 1.0, dr)}) contrast(1.1) brightness(${lerp(1.04, .8, dr)}) sepia(${lerp(.28, .02, dr)}) hue-rotate(${lerp(-8, 0, dr)}deg)`);
  const gl = prog(t, .3, 2.6); if (gl > 0 && gl < 1) {   // glint sweeping across the panels
    const x = lerp(-300, W + 300, eio(gl)), gr = g.createLinearGradient(x - 220, 0, x + 220, 0);
    gr.addColorStop(0, "rgba(255,230,170,0)"); gr.addColorStop(.5, "rgba(255,230,170,.22)"); gr.addColorStop(1, "rgba(255,230,170,0)");
    g.save(); g.globalCompositeOperation = "screen"; g.fillStyle = gr; g.fillRect(0, 900, W, H - 900); g.restore();
  }
}

window.seek = function (t) {
  BOXES = []; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = "none";
  g.fillStyle = "#0a090e"; g.fillRect(0, 0, W, H);
  ({ A: picA, B: picB, C: picC })[OPT](t);
  vignette(); topShade(.8, 820);
  tag(t); headline(t); filmGrain(t);
  return BOXES;
};
window.DUR = DUR; window.SAFE = SAFE; window.CUES = [{ s: "but", t: T_BUT }, { s: "send", t: T_SEND }, { s: "anywhere", t: T_ANY }];
window.ready = false;
Promise.all([new Promise(r => img.complete ? r() : img.onload = r), document.fonts.load("800 80px Playfair"), document.fonts.load("italic 800 80px Playfair"), document.fonts.load("700 30px Inter")])
  .then(() => { window.seek(0); window.ready = true; });
</script></body></html>
