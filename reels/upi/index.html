  x.font = "800 40px Figtree"; x.textAlign = "center"; x.fillText("Paying", w / 2, 130); x.font = "600 30px Figtree"; x.fillStyle = "rgba(255,255,255,.8)"; x.fillText("Raju Tea Stall · raju@upi", w / 2, 178);
  // avatar
  x.fillStyle = "#e8672a"; x.beginPath(); x.arc(w / 2, 300, 62, 0, 6.283); x.fill(); x.fillStyle = "#fff"; x.font = "800 56px Figtree"; x.fillText("R", w / 2, 320);
  x.fillStyle = "#111"; x.font = "800 150px Figtree"; x.fillText("₹10", w / 2, 560);
  x.fillStyle = "#888"; x.font = "600 30px Figtree"; x.fillText("Chai ☕", w / 2, 620);
  const paid = t >= T.paid;
  if (!paid) { const press = t > T.tap ? Math.exp(-(t - T.tap) * 10) : 0; x.save(); x.translate(w / 2, 900); x.scale(1 - press * .05, 1 - press * .05);
    x.fillStyle = "#5b2d8c"; x.beginPath(); x.roundRect(-210, -60, 420, 120, 60); x.fill(); x.fillStyle = "#fff"; x.font = "800 48px Figtree"; x.fillText("Pay ₹10", 0, 16); x.restore();
    if (t > T.tap) { x.strokeStyle = "rgba(91,45,140,.5)"; x.lineWidth = 6; const k = prog(t, T.tap, T.paid); x.beginPath(); x.arc(w / 2, 900, 30 + k * 200, 0, 6.283); x.stroke(); }
  } else { // success
    const k = eob(prog(t, T.paid, T.paid + .45)); x.fillStyle = "#e9f7ee"; x.fillRect(0, 210, w, h - 210);
    x.save(); x.translate(w / 2, 450); x.scale(k, k); x.fillStyle = "#1fa463"; x.beginPath(); x.arc(0, 0, 120, 0, 6.283); x.fill();
    x.strokeStyle = "#fff"; x.lineWidth = 22; x.lineCap = "round"; x.lineJoin = "round"; x.beginPath(); const c = prog(t, T.paid + .1, T.paid + .5); x.moveTo(-50, 0); x.lineTo(-50 + 35 * clamp(c * 2), 35 * clamp(c * 2)); if (c > .5) x.lineTo(-15 + 75 * (c - .5) * 2, 35 - 85 * (c - .5) * 2); x.stroke(); x.restore();
    x.fillStyle = "#111"; x.font = "800 64px Figtree"; x.textAlign = "center"; x.fillText("₹10 paid", w / 2, 680); x.fillStyle = "#555"; x.font = "600 30px Figtree"; x.fillText("to Raju Tea Stall", w / 2, 730);
    x.fillStyle = "#999"; x.font = "600 26px Figtree"; x.fillText("UPI Ref 4285 1937 0062", w / 2, 790);
  }
  PHONE_T.needsUpdate = true;
}

// ---------- timeline ----------
const T = { tap: 1.15, paid: 1.55, pull: 4.2, freeze: 7.9 };
const CAMK = [   // camera: position (px,py,pz) + look target (lx,ly,lz) + fov
  { t: 0, px: .04, py: 1.47, pz: 2.55, lx: .03, ly: 1.25, lz: 2.11, fov: 36 },
  { t: 4.2, px: .05, py: 1.47, pz: 2.66, lx: .03, ly: 1.25, lz: 2.1, fov: 36, hold: 1 },
  { t: 6.6, px: 2.1, py: 1.55, pz: 7.4, lx: -.2, ly: 2.15, lz: 0, fov: 40 },
  { t: 8.7, px: 1.8, py: 1.6, pz: 6.9, lx: -.2, ly: 2.2, lz: 0, fov: 40 },
  { t: 10.6, px: 1.5, py: 1.65, pz: 6.5, lx: -.2, ly: 2.25, lz: 0, fov: 41 },
];
function frozenTime(t) { return t < T.freeze ? t : T.freeze + (t - T.freeze) * Math.exp(-(t - T.freeze) * 6) * .3; }   // world clock eases to a stop

function setWorld(t) {
  const wt = frozenTime(t);                                  // the world's own clock (stops at the freeze)
  // camera
  const c = track(CAMK, t); CAM.position.set(c.px, c.py, c.pz); CAM.fov = c.fov; CAM.updateProjectionMatrix(); CAM.lookAt(c.lx, c.ly, c.lz);
  // hand + phone: held up in front of the stall, slight natural sway
  const sway = Math.sin(wt * 1.3) * .004;
  HAND.position.set(.03 + sway, 1.22 + Math.sin(wt * 1.7) * .003, 2.12); HAND.rotation.set(-.35, .06, .03);
  const th = HAND.userData.thumb, near = eo(prog(t, T.tap - .6, T.tap - .1)) * (1 - eio(prog(t, T.tap + .2, T.tap + .7))), tapK = Math.sin(clamp((t - T.tap + .15) / .3) * Math.PI);
  th.position.set(lerp(.06, .012, near), lerp(-.1, -.048, near), .008 + (1 - tapK) * .008); th.rotation.set(.2, 0, .7); th.visible = near > .02;
  // your head/body fade in once the camera leaves your eyes
  const away = clamp((CAM.position.distanceTo(new THREE.Vector3(.2, 1.6, 2.62)) - .45) / .5);
  YOUHEAD.forEach(m => { m.material.opacity = away; m.visible = away > .02; });
  drawPhone(t);
  // Raju pours chai: kettle tilts up and down on a loop
  const pour = .5 + .5 * Math.sin(wt * 1.6);
  RAJU.userData.armR.rotation.set(-1.25 - pour * .12, 0, -.55); RAJU.userData.armL.rotation.set(-1.05, 0, .35);
  RAJU.userData.head.rotation.y = Math.sin(wt * .7) * .2;
  KETTLE.position.set(-.08, 1.36 + pour * .06, -.02); KETTLE.rotation.z = -pour * .5;
  POUR.visible = pour > .55; POUR.scale.y = .6 + pour * .5;
  // steam rises from the kettle and the glasses
  PUFFS.forEach((p, i) => { const per = 2.4, ph = ((wt + i * per / PUFFS.length) % per) / per, src = i % 3 === 0 ? [-.4, 1.6, -.05] : [.2 + (i % 5) * .1, 1.22, .18];
    p.position.set(src[0] + Math.sin(ph * 6 + i) * .05, src[1] + ph * .55, src[2]); const s = .05 + ph * .2; p.scale.set(s, s, s); p.material.opacity = .45 * Math.sin(ph * Math.PI); });
  // bird glides across the street, flapping
  const bk = (wt * .9) % 14; BIRD.position.set(-7 + bk * 1.0, 3.6 + Math.sin(bk * .9) * .2, 2.2); BIRD.rotation.y = 0;
  const fl = Math.sin(wt * 18) * .7; BIRD.userData.w1.rotation.x = fl; BIRD.userData.w2.rotation.x = -fl;
  // string lights twinkle
  BULBS.forEach((b, i) => b.material.emissiveIntensity = 1.6 + Math.sin(wt * 3 + i) * .6);
}

// ---------- 2D type layer ----------
let BOXES = [];
const F = { body: (s, w = 800) => `${w} ${s}px Figtree`, disp: s => `800 ${s}px "Bricolage Grotesque"`, serif: s => `italic ${s}px "Instrument Serif"` };
function lum(c) { const l = v => (v /= 255) <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; return .2126 * l(c[0]) + .7152 * l(c[1]) + .0722 * l(c[2]); }
function contrastUnder(x, y, w, h) { const X = clamp(x | 0, 0, W - 1), Y = clamp(y | 0, 0, H - 1), d = g.getImageData(X, Y, clamp(w | 0, 1, W - X), clamp(h | 0, 1, H - Y)).data, L = [];
  for (let i = 0; i < d.length; i += 44) L.push(lum([d[i], d[i + 1], d[i + 2]])); L.sort((a, b) => a - b); const bg = L[Math.floor(L.length * .9)]; return 1.05 / (bg + .05); }
// white type with a soft dark glow; words pop in one by one
function words(id, text, font, size, y, t, t0, t1, opts = {}) {
  if (t < t0 || t > t1) return; const out = eio(prog(t, t1 - .35, t1));
  g.save(); g.font = font; g.textBaseline = "alphabetic"; g.textAlign = "left"; g.letterSpacing = (opts.ls ?? -1) + "px";
  const parts = text.split(" "), sp = g.measureText(" ").width, ws = parts.map(p => g.measureText(p).width), tw = ws.reduce((a, b) => a + b, 0) + sp * (parts.length - 1);
  let x = 540 - tw / 2; const y0 = y - size * .78;
  g.save(); g.filter = `blur(${Math.max(10, size * .12)}px)`; g.fillStyle = "rgba(8,6,20,1)"; g.globalAlpha = .85 * (1 - out) * eo(prog(t, t0, t0 + .4)); for (let k = 0; k < 4; k++) g.fillText(text, x, y); g.restore();
  const contrast = contrastUnder(x, y0, tw, size);
  parts.forEach((p, i) => { const k = prog(t, t0 + i * (opts.stagger ?? .12), t0 + i * (opts.stagger ?? .12) + .35), s = lerp(.6, 1, eob(k));
    g.save(); g.globalAlpha = clamp(k * 2) * (1 - out); g.fillStyle = opts.color || "#fff"; g.translate(x + ws[i] / 2, y - size * .3 - out * 40); g.scale(s, s); g.translate(-(x + ws[i] / 2), -(y - size * .3)); g.fillText(p, x, y); g.restore(); x += ws[i] + sp; });
  g.restore();
  const allIn = t0 + (parts.length - 1) * (opts.stagger ?? .12) + .35;
  BOXES.push({ id, group: opts.group, words: parts.length, x: 540 - tw / 2, y: y0, w: tw, h: size, a: (1 - out) * eo(prog(t, t0, t0 + .4)), read: out > .02 || t < allIn ? 0 : 1, contrast, size });
}
function hud(t) { // time-freeze clock
  const a = win(t, T.freeze + .1, DUR + 1, .4, .1); if (a <= 0) return;
  g.save(); g.globalAlpha = a; g.font = F.body(42, 800); const label = "TIME  0.00 s", tw = g.measureText(label).width + 110, x = 540 - tw / 2, y = 300;
  g.fillStyle = "rgba(10,14,30,.82)"; g.beginPath(); g.roundRect(x, y, tw, 84, 42); g.fill(); g.fillStyle = "#7ad7ff"; g.beginPath(); g.arc(x + 42, y + 42, 10, 0, 6.283); g.fill();
  g.fillStyle = "#fff"; g.textBaseline = "middle"; g.textAlign = "left"; g.fillText(label, x + 70, y + 44); g.restore();
  BOXES.push({ id: "hud", x, y, w: tw, h: 84, a, read: a, contrast: 15, size: 42 });
}

function seek(t) {
  BOXES = [];
  setWorld(t);
  R.render(S, CAM);
  // freeze grade: colour drains to a cool tone as time stops, with a ripple
  const fz = eo(prog(t, T.freeze, T.freeze + .6));
  g.filter = fz > .01 ? `saturate(${1 - .55 * fz}) brightness(${1 - .08 * fz}) contrast(${1 + .08 * fz})` : "none";
  g.drawImage(R.domElement, 0, 0); g.filter = "none";
  if (fz > .01) { g.fillStyle = `rgba(40,80,170,${.16 * fz})`; g.fillRect(0, 0, W, H);
    const rk = prog(t, T.freeze, T.freeze + .9); if (rk < 1) { g.strokeStyle = `rgba(190,230,255,${.6 * (1 - rk)})`; g.lineWidth = 10 * (1 - rk) + 2; g.beginPath(); g.arc(540, 980, rk * 1300, 0, 6.283); g.stroke(); } }
  // type
  // the phone says "₹10" itself — the only line is the payoff of the tap
  words("t2", "That took 2 seconds.", F.disp(92), 92, 400, t, T.paid + .15, T.pull + .15, { stagger: .07 });
  words("t3", "What really happened?", F.body(78), 78, 450, t, T.pull + 1.15, T.freeze - .05, { stagger: .1 });
  words("t4", "Let's freeze time.", F.disp(100), 100, 540, t, T.freeze + .35, DUR + 1, { stagger: .16 });
  hud(t);
  // vignette + grain-free (3D is clean); fade in
  const v = g.createRadialGradient(540, 960, 600, 540, 960, 1300); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.35)"); g.fillStyle = v; g.fillRect(0, 0, W, H);
  const f = 1 - prog(t, 0, .2); if (f > 0) { g.fillStyle = `rgba(0,0,0,${f})`; g.fillRect(0, 0, W, H); }
  return BOXES.map(b => ({ ...b, x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.w), h: Math.round(b.h), a: +b.a.toFixed(2), contrast: +b.contrast.toFixed(1) }));
}
window.DUR = DUR; window.SAFE = SAFE; window.T = T;
window.ready = (async () => { await Promise.all([F.body(60), F.body(30, 600), F.disp(100), F.serif(100)].map(f => document.fonts.load(f)));
  window.seek = seek; window.CUES = [{ t: T.tap, s: "tap" }, { t: T.paid, s: "ding" }, { t: T.freeze, s: "freeze" }]; seek(0); return { ok: true }; })();
</script>
